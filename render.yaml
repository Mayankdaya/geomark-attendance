# Render Blueprint — FREE tier deployment.
# Free limits (see https://render.com/docs/free): service sleeps after 15 min
# without traffic (~1 min to wake), 750 hrs/month, and the filesystem is
# EPHEMERAL — no persistent disk allowed on free plans. The container
# entrypoint re-creates + re-seeds the demo database on every (re)start, so
# the app always works, but data you create is lost on restart.
# For durable data, switch `plan: free` → `plan: starter` and add:
#     disk:
#       name: attendancedb
#       mountPath: /app/db
#       sizeGB: 1
services:
  - type: web
    name: geomark-attendance
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
