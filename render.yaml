# Render Blueprint — deploys this app + a persistent disk for the SQLite DB.
# NOTE: persistent disks require a paid Render instance type (Starter or up).
# Free instances have an ephemeral filesystem, so attendance data would be
# lost on every restart — do not use `plan: free` with this SQLite app.
services:
  - type: web
    name: geomark-attendance
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    healthCheckPath: /api/auth/me
    disk:
      name: attendancedb
      mountPath: /app/db
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: 1
